<html lang="ru">
<head>
<meta charset="utf-8">

<meta property="og:title" content="Диспетчерская · Баатр Утнасунов">

<style>
/* The shift screen from Figma (page «v3 · Рабочий экран», 1440×900): panels float over a real-city map.
   Tokens = Figma variables «Color», modes Light / Dark. */
:root{
  --bg:#E4E5E7; --s1:#F8F9FA; --s2:#EFF1F3; --s3:#E5E8EB; --s4:#D9DDE1; --fg:#1B1D20; --muted:#5C5C5C;
  --line:rgba(0,0,0,.10); --line2:rgba(0,0,0,.16); --hover:rgba(0,0,0,.04); --sel:rgba(0,0,0,.07);
  --delay:#B25E00; --delay-soft:rgba(178,94,0,.14); --crit:#C8261A; --crit-soft:rgba(200,38,26,.12);
  --res:#0B6E9C; --res-soft:rgba(11,110,156,.12); --ok:#6E7176; --ok-soft:rgba(0,0,0,.06);
  --acc:#0F7B5F; --on-acc:#FFFFFF; --acc-soft:rgba(15,123,95,.10); --route:#2B2D31; --shadow:rgba(0,0,0,.12);
  --on-status:#FFFFFF; --map:url(osm-light.webp);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121417; --s1:#1C1E22; --s2:#23262B; --s3:#2E3137; --s4:#3A3E45; --fg:#E9EAEC; --muted:#A3A3A3;
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.16); --hover:rgba(255,255,255,.06); --sel:rgba(255,255,255,.10);
  --delay:#E9AE45; --delay-soft:rgba(233,174,69,.14); --crit:#F2584B; --crit-soft:rgba(242,88,75,.16);
  --res:#4FB3E0; --res-soft:rgba(79,179,224,.14); --ok:#D4D4D4; --ok-soft:rgba(255,255,255,.10);
  --acc:#3BB98C; --on-acc:#0B1F18; --acc-soft:rgba(59,185,140,.14); --route:#D4D4D4; --shadow:rgba(0,0,0,.45);
  --on-status:#171717; --map:url(osm-dark.webp); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121417; --s1:#1C1E22; --s2:#23262B; --s3:#2E3137; --s4:#3A3E45; --fg:#E9EAEC; --muted:#A3A3A3;
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.16); --hover:rgba(255,255,255,.06); --sel:rgba(255,255,255,.10);
  --delay:#E9AE45; --delay-soft:rgba(233,174,69,.14); --crit:#F2584B; --crit-soft:rgba(242,88,75,.16);
  --res:#4FB3E0; --res-soft:rgba(79,179,224,.14); --ok:#D4D4D4; --ok-soft:rgba(255,255,255,.10);
  --acc:#3BB98C; --on-acc:#0B1F18; --acc-soft:rgba(59,185,140,.14); --route:#D4D4D4; --shadow:rgba(0,0,0,.45);
  --on-status:#171717; --map:url(osm-dark.webp); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/18px var(--font);font-variant-numeric:tabular-nums;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
#root{position:fixed;inset:0;overflow:hidden}
#root.narrow{overflow:auto}
.stage{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;background:var(--bg);overflow:hidden}
.sizer{position:absolute;left:0;top:0;pointer-events:none}
.map{position:absolute;left:347px;top:-40px;width:1440px;height:900px;background:var(--map) 0 0/100% 100% no-repeat}
svg.ov{position:absolute;left:0;top:0;width:1440px;height:900px;overflow:visible;pointer-events:none}
.pnl{position:absolute;background:var(--s1);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 12px var(--shadow);overflow:hidden}
.t11{font-size:11px;line-height:14px}.t12{font-size:12px;line-height:16px}.t13{font-size:13px;line-height:18px}.t14{font-size:14px;line-height:20px}.t15{font-size:15px;line-height:20px}
.t18{font-size:18px;line-height:24px;font-weight:600}.t22{font-size:22px;line-height:30px;font-weight:600}
.mut{color:var(--muted)} .b{font-weight:600} .m{font-weight:500}
.caps{font-size:12px;line-height:16px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.01em}
svg.i{flex:none;display:block}
/* rail */
.rail{left:8px;top:8px;width:56px;height:884px;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;margin-bottom:8px}
.ri{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative}
.ri.on{background:var(--acc-soft);color:var(--acc)}
.ri:hover{background:var(--hover)}
.badge{position:absolute;right:6px;top:4px;min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:#fff;font-size:10px;line-height:16px;font-weight:600;text-align:center;padding:0 4px}
.rail .sp{flex:1}
/* routes */
.routes{left:72px;top:8px;width:336px;height:884px;display:flex;flex-direction:column}
.rhead{padding:20px 20px 12px;display:flex;flex-direction:column;gap:12px}
.rtitle{display:flex;align-items:baseline;justify-content:space-between}
.rtitle h1{margin:0;font-size:20px;line-height:28px;font-weight:600}
.blk{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}

.blk .h .r{margin-left:auto}
.blk.kpi{background:var(--acc-soft);flex-direction:row;align-items:center;justify-content:space-between;padding:14px 16px}
.blk.kpi .v{font-size:24px;line-height:30px;font-weight:600;color:var(--acc)}
.blk.crit{background:var(--crit-soft)} .blk.crit .h{color:var(--crit)}
.blk.res{background:var(--res-soft)} .blk.res .h{color:var(--res)}
.blk.ok{background:var(--ok-soft)} .blk.ok .h{color:var(--ok)}
.srch{display:flex;gap:8px}
.inp{flex:1;height:44px;border:1px solid var(--line2);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted);font-size:15px}
.ib{width:44px;height:44px;border:1px solid var(--line2);border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);padding:0 20px}
.tab{padding:6px 0 8px;color:var(--muted);font-size:15px;line-height:20px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--fg);font-weight:500;border-color:var(--fg)}
.thead{display:flex;justify-content:space-between;padding:14px 20px 8px}
.rrow{display:flex;align-items:center;gap:12px;padding:9px 20px;position:relative;cursor:default}
.rrow.on{background:var(--sel)} .rrow.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.num{flex:none;width:30px;height:30px;border-radius:8px;background:var(--s3);display:grid;place-items:center;font-weight:600;font-size:14px}
.rrow.on .num{background:var(--acc);color:var(--on-acc)}
.rtx{flex:1;min-width:0}
.rtx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtx .s{font-size:13px;line-height:18px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--delay)}
.cnt{flex:none;width:30px;height:30px;border-radius:8px;background:var(--s3);display:grid;place-items:center;font-size:14px;font-weight:500}
/* trips */
.trips{left:416px;top:8px;width:516px;height:884px;display:flex;flex-direction:column}
.thd{padding:20px 20px 0}
.thd .t13{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thd h2{margin:0;font-size:24px;line-height:30px;font-weight:600}
.rib{padding:16px 20px 8px}
.ribh{display:flex;justify-content:space-between;align-items:baseline}
.ribb{position:relative;height:66px;margin-top:6px}
.chipn{position:absolute;top:0;height:22px;padding:2px 7px;border-radius:6px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;border:1px solid var(--line2);background:var(--s1)}
.chipn.delay{background:var(--delay);color:var(--on-status);border-color:transparent;padding:2px 6px}
.chipn.crit{background:var(--crit);color:#fff;border-color:transparent;padding:2px 6px}
.chipn.res{background:var(--res);color:#fff;border-color:transparent;top:46px}
.gapl{position:absolute;top:48px;font-size:12px;line-height:16px;font-weight:600;transform:translateX(-50%);white-space:nowrap}
.sumrow{display:flex;gap:10px;margin-top:10px}
.sumc{flex:1;background:var(--s2);border-radius:10px;padding:10px 12px}
.sumc .v{font-size:22px;line-height:28px;font-weight:600}
.ttabs{margin-top:8px}
.tbl{flex:1;overflow:hidden}
.trh{display:grid;grid-template-columns:104px 60px 168px 52px 64px;gap:8px;padding:14px 20px 8px;align-items:center}
.trh span:last-child,.tr .dev{text-align:right}
.tr{display:grid;grid-template-columns:104px 60px 168px 52px 64px;gap:8px;padding:7px 20px;align-items:center;position:relative;font-size:15px;line-height:20px}
.tr.on{background:var(--sel)} .tr.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.tr.crit{background:var(--crit-soft)} .tr.crit::before{background:var(--crit)}
.tr.resv{background:var(--res-soft)} .tr.resv::before{background:var(--res)}
.plate{display:inline-flex;height:32px;align-items:center;padding:0 10px;border:1px solid var(--line2);border-radius:8px;font-weight:500;white-space:nowrap;background:var(--s1)}
.tr.crit .plate{border-color:var(--crit);color:var(--crit)}
.bar{position:relative;height:24px}
.bar .tk{position:absolute;left:0;right:0;top:10px;height:4px;border-radius:2px;background:var(--s3)}
.bar .fl{position:absolute;left:0;top:10px;height:4px;border-radius:2px;background:var(--muted)}
.bar .ch{position:absolute;top:2px;height:20px;padding:1px 7px;border-radius:10px;font-size:12px;line-height:16px;font-weight:500;border:1px solid var(--line2);background:var(--s1);white-space:nowrap}
.bar.delay .fl{background:var(--delay)} .bar.delay .ch{background:var(--delay);color:var(--on-status);border-color:transparent;font-weight:600}
.bar.crit .ch{background:var(--crit);color:#fff;border-color:transparent;font-weight:600}
.dev.delay{color:var(--delay);font-weight:600} .dev.crit{color:var(--crit);font-weight:600} .dev.res{color:var(--res);font-weight:600}
.log{display:flex;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
.log time{flex:none;width:44px;color:var(--muted);font-weight:500;font-size:14px;line-height:20px}
.log .d{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px}
.log b{display:block;font-weight:500;font-size:14px;line-height:20px}
.empty{padding:24px 20px;color:var(--muted)}
/* map chrome */
.mode{position:absolute;left:948px;top:16px;display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--s1);border:1px solid var(--line);box-shadow:0 2px 8px var(--shadow)}
.mode a{padding:5px 10px;border-radius:7px;font-weight:500;color:var(--muted)}
.mode a.on{background:var(--s3);color:var(--fg);font-weight:600}
.mode a:not(.on):hover{color:var(--fg)}
.zoom{position:absolute;left:1380px;top:16px;width:44px;border-radius:10px;background:var(--s1);border:1px solid var(--line);box-shadow:0 2px 8px var(--shadow)}
.zoom div{height:44px;display:grid;place-items:center;font-size:20px}
.lay{position:absolute;left:1380px;top:120px;width:44px;height:44px;border-radius:10px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 8px var(--shadow)}
.attr{position:absolute;right:16px;top:172px;font-size:10px;line-height:12px;color:var(--muted);opacity:.85}
.demo{position:absolute;left:948px;top:60px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:10px;background:var(--s1);border:1px solid var(--line);box-shadow:0 2px 8px var(--shadow);max-width:470px}
.demo .st{color:var(--muted);font-size:12px;line-height:16px;white-space:nowrap}
.demo button{padding:5px 10px;border-radius:7px;background:var(--fg);color:var(--bg);font-weight:600;font-size:12px;line-height:16px;white-space:nowrap}
/* markers */
.mk{position:absolute;display:flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 6px;border-radius:12px;background:var(--s1);border:1px solid var(--line2);font-weight:600;font-size:13px;white-space:nowrap;box-shadow:0 1px 3px var(--shadow);transition:left .6s,top .6s}
.mk .x{color:var(--delay);font-weight:500}
.mk.delay .i{color:var(--delay)}
.mk.res{border:1.5px solid var(--res);color:var(--res)}
.mk.res.sel{box-shadow:0 0 0 2px var(--s1),0 0 0 3.5px var(--res)}
.mk.dim{opacity:.55}
.pin{position:absolute;display:flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;background:var(--crit);color:#fff;font-weight:600;font-size:13px;transform:translate(-50%,-100%);box-shadow:0 2px 8px rgba(200,38,26,.35)}
.depot{position:absolute;padding:6px 10px;border-radius:8px;background:var(--s1);border:1px solid var(--line);font-size:12px;line-height:16px}
.slab{position:absolute;font-size:11px;line-height:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.eta{position:absolute;height:22px;padding:2px 8px;border-radius:11px;border:1px solid var(--res);background:var(--s1);color:var(--res);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.ring{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid var(--crit);animation:pulse 2.2s ease-out infinite}
.ring.b{animation-delay:1.1s}
.ack{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:1.5px solid var(--crit);opacity:.6;background:radial-gradient(var(--crit-soft),transparent 70%)}
/* vehicle card */
.card{left:943px;width:481px;padding:20px;display:flex;flex-direction:column;gap:14px}
.chd{display:flex;align-items:center;gap:8px}
.chd .t{font-size:20px;line-height:26px;font-weight:600}
.chd .r{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500}
.pill{display:inline-flex;align-items:center;height:30px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;font-size:15px;font-weight:500}
.bn{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:15px;line-height:20px}
.bn .r{margin-left:auto}
.bn.crit{background:var(--crit-soft)} .bn.crit .i,.bn.crit .r{color:var(--crit)}
.bn.res{background:var(--res-soft)} .bn.res .i,.bn.res .r{color:var(--res)}
.prog{display:flex;align-items:center;gap:8px;font-size:15px}
.prog .ln{flex:1;position:relative;height:16px}
.prog .ln i{position:absolute;top:7px;height:2px;left:0;right:0;background:var(--s4)}
.prog .ln i.f{background:var(--route);right:auto}
.prog .ln b{position:absolute;top:3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--route);background:var(--s1);margin-left:-5px}
.prog .ln b.n{border-color:var(--s4)}
.prog .ln em{position:absolute;top:-2px;transform:translateX(-50%);height:20px;padding:1px 7px;border-radius:10px;font-style:normal;font-size:12px;line-height:18px;font-weight:600;white-space:nowrap}
.prog .ln em.delay{background:var(--delay);color:var(--on-status)} .prog .ln em.crit{background:var(--crit);color:#fff}
.ends{display:flex;justify-content:space-between;margin-top:-8px;color:var(--muted);font-size:13px}
.sug{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--s2);font-size:13px;line-height:18px}
.sug .i{color:var(--acc);margin-top:1px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.p{background:var(--acc);color:var(--on-acc)}
.btn.p:hover{filter:brightness(1.06)}
.btn.s{background:var(--s3)} .btn.s:hover{background:var(--s4)}
.btn.g{color:var(--muted)} .btn.g:hover{color:var(--fg)}
.btn.lg{height:44px;font-size:15px;justify-content:center;width:100%}
.rsh{display:flex;align-items:center;justify-content:space-between}
.arr{display:flex;gap:6px} .arr span{width:32px;height:32px;border:1px solid var(--line2);border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.rcs{display:flex;gap:10px;overflow:hidden;margin-right:-20px;padding-right:20px}
.rc{flex:none;width:186px;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left}
.rc.on{border:2px solid var(--acc);padding:11px 13px;background:var(--acc-soft)}
.rc.off{opacity:.55;cursor:not-allowed}
.rc .h{display:flex;align-items:center;justify-content:space-between;font-size:17px;line-height:22px;font-weight:600}
.tag{font-size:12px;line-height:16px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--res-soft);color:var(--res)}

.why{display:flex;gap:8px;font-size:13px;line-height:18px;color:var(--muted)} .why .i{color:var(--acc);margin-top:1px}
.ride{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

.pb{height:6px;border-radius:3px;background:var(--s3);overflow:hidden} .pb i{display:block;height:100%;background:var(--res);border-radius:3px;transition:width 1s}
.ds{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ds .dot.ok{background:var(--acc)}
.tl{position:relative;height:10px;margin-top:4px} .tl .tk{position:absolute;left:0;right:0;top:3px;height:4px;border-radius:2px;background:var(--s3)}
.tl i{position:absolute;top:0;width:10px;height:10px;border-radius:50%;margin-left:-5px}.tl i.tk{width:auto;height:4px;top:3px;margin:0;border-radius:2px}
/* phone */
.veil{position:absolute;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;backdrop-filter:blur(2px)}
.phone{width:390px;height:844px;transform:scale(.92);border-radius:48px;background:var(--s1);border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}

.na{background:var(--res-soft);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px}

.na .t{font-size:24px;line-height:30px;font-weight:600}

.kv{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:15px}

    const cx = pos[n] * W, w = 36, x = Math.min(Math.max(cx - w / 2, right + 6), W - w); right = x + w; const k = kind(n);
    chips += `<span class="chipn ${k}" style="left:${x}px">${n}</span>`;
    leads += `<path d="M${x + w / 2} 22 L${cx} 33" stroke="${k ? `var(--${k})` : 'var(--line2)'}" stroke-width="1" fill="none"/>`;
    dots += `<circle cx="${cx}" cy="36" r="4" fill="${k ? `var(--${k})` : 'var(--fg)'}" stroke="var(--s1)" stroke-width="1.5"/>`;
  }
  const base = `<rect x="0" y="34" width="${W}" height="4" rx="2" fill="var(--s3)"/><rect x="${pos[ids[0]] * W}" y="34" width="${(pos[ids[ids.length - 1]] - pos[ids[0]]) * W}" height="4" fill="var(--route)"/>`;
  const sg = segs.map(([a, b, c]) => `<rect x="${a * W}" y="34" width="${(b - a) * W}" height="4" fill="${c}"/>`).join('');
  const labs = inc ? `${S.step === 1 ? `<span class="gapl" style="left:${.48 * W}px;color:var(--crit)">8 мин</span>` : `<span class="chipn res" style="left:${.46 * W - 52}px">${S.res} · ${RESV[S.res].min} мин</span>`}<span class="gapl" style="left:${.645 * W}px;color:var(--delay)">10 мин</span>`
    : `<span class="gapl" style="left:${.455 * W}px;color:var(--delay)">2 мин</span><span class="gapl" style="left:${.575 * W}px;color:var(--delay)">10 мин</span>`;
  return `<div class="rib"><div class="ribh"><span class="t14 b">Интервалы на линии</span><span class="t13 mut">Вокзал → Северная</span></div>
    <div class="ribb"><svg width="${W}" height="66" style="position:absolute;left:0;top:0;overflow:visible" aria-hidden="true">${base}${sg}${leads}${dots}</svg>${chips}${labs}</div></div>`;
}
function tripRows() {
  const now = tmin(S.step === 0 ? '14:28' : '14:32'), inc = S.step > 0;
  const order = inc ? ['412', '405', '410', '409', '407', '403', '401'] : ['405', '410', '409', '407', '412', '403', '401'];
  return order.map(n => {
    const st = tmin(START[n]), el = now - st, end = hhmm(st + LAP);
    let cls = '', bar = '', dev = '0', devc = '', endT = end;
    const late = n === '405';
    if (inc && n === '412') {
      cls = S.step === 1 ? 'crit' : 'resv'; endT = '—';
      bar = `<div class="bar crit"><i class="tk"></i><span class="ch" style="left:0">${S.step === 1 ? 'стоит 3 мин' : 'ждёт замену'}</span></div>`;
      dev = S.step === 1 ? '+3 мин' : '→ ' + arrive(); devc = S.step === 1 ? 'crit' : 'res';
    } else {
      const w = Math.round(el / LAP * 168), cw = el >= 10 ? 52 : 46, x = Math.max(0, Math.min(168 - cw, w - cw + 2));
      bar = `<div class="bar${late ? ' delay' : ''}"><i class="tk"></i><i class="fl" style="width:${w}px"></i><span class="ch" style="left:${x}px">${el} мин</span></div>`;
      if (late) { dev = '+4 мин'; devc = 'delay'; }
      if (!inc && late) cls = 'on';
    }
    return `<div class="tr ${cls}"><span><span class="plate">${PLATE[n]}</span></span><span>${START[n]}</span>${bar}<span>${endT}</span><span class="dev ${devc}">${dev}</span></div>`;
  }).join('');
}
function logRows() {
  const R = PLATE[S.res], items = LOG.filter(e => e[0] <= S.step);
  if (!items.length) return `<div class="empty">За последний час событий по маршруту №10 нет. За смену решено 4 инцидента.</div>`;
  const col = { crit: 'var(--crit)', delay: 'var(--delay)', res: 'var(--res)', ok: 'var(--acc)', mut: 'var(--muted)' };
  return items.map(([, t, c, h, s]) => `<div class="log"><time>${t.replace('{ARR}', arrive())}</time><i class="d" style="background:${col[c]}"></i><div><b>${h.replace('{R}', R)}</b><div class="t13 mut">${s.replace('{how}', S.res === '417' ? 'принята без изменений' : 'изменена диспетчером').replace('{R}', R)}</div></div></div>`).join('');
}
function trips() {
  const t = S.tab;
  return `<section class="pnl trips" aria-label="Маршрут №10"><div class="thd"><h2>Маршрут №10</h2><div class="t13 mut">Вокзал — Северная · 7 бортов · ООО «Северный электротранс» · план 6 мин</div></div>${ribbon()}

    <div class="tbl">${t === 'trips' ? `<div class="trh caps"><span>Госномер</span><span>Начало</span><span style="text-align:center">В пути</span><span>Конец</span><span>Откл.</span></div>${tripRows()}` : logRows()}</div></section>`;
}
function overlay() {
  const p = S.step === 0 ? POS.normal : S.step === 4 ? POS.review : POS.after, inc = S.step > 0 && S.step < 4;
  let svg = `<path d="${path(Q)}" stroke="var(--route)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (inc) svg += `<path d="${path(sub(.41, .55))}" stroke="var(--crit)" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  for (const s of [.30, .36, .46, .55, .62, .71, .80, .88, .95]) { const [x, y] = pt(s); svg += `<circle cx="${x}" cy="${y}" r="5" fill="var(--s1)" stroke="${inc && s >= .41 && s <= .55 ? 'var(--crit)' : 'var(--route)'}" stroke-width="2.5"/>`; }
  if (S.step === 2 || S.step === 3) { const a = [DEP[0] + 12, DEP[1] + 12], c = CRASH; svg += `<path d="M${a[0]} ${a[1]} Q ${a[0] - 10} ${c[1] + 10} ${c[0] + 6} ${c[1] + 4}" stroke="var(--res)" stroke-width="2" fill="none" stroke-dasharray="${S.step === 2 ? '5 5' : '0'}"/>`; }
  let html = `<svg class="ov" viewBox="0 0 1440 900" aria-hidden="true">${svg}</svg>`;
  const lab = (q, s, dx, dy, center) => { const [x, y] = pt(q); return `<span class="slab" style="left:${x + dx}px;top:${y + dy}px${center ? ';transform:translateX(-50%)' : ''}">${s}</span>`; };
  html += lab(.36, 'Рынок', -60, 6) + (inc ? '' : lab(.46, 'Площадь Мира', -40, 12)) + lab(.62, 'Ул. Ленина', 12, 6);
  if (inc) html += `<span class="ack" style="left:${CRASH[0]}px;top:${CRASH[1]}px"></span>${S.step === 1 ? `<span class="ring" style="left:${CRASH[0]}px;top:${CRASH[1]}px"></span><span class="ring b" style="left:${CRASH[0]}px;top:${CRASH[1]}px"></span>` : ''}<span class="pin" style="left:${CRASH[0]}px;top:${CRASH[1] - 46}px">${ic('warning', 13)}412</span><svg class="ov"><path d="M${CRASH[0]} ${CRASH[1] - 46} V ${CRASH[1]}" stroke="var(--crit)" stroke-width="2"/><circle cx="${CRASH[0]}" cy="${CRASH[1]}" r="6" fill="var(--crit)" stroke="var(--s1)" stroke-width="2"/></svg>`;
  // route buses alternate above / below the line
  const ids = Object.keys(p).sort((a, b) => p[a] - p[b]); let up = true;
  for (const n of ids) { if (inc && n === '412') continue; const [x, y] = pt(p[n]); const late = n === '405' && S.step < 4;
    html += `<span class="mk${late ? ' delay' : ''}" style="left:${x}px;top:${up ? y - 32 : y + 8}px;transform:translateX(-50%)">${ic(late ? 'stopwatch' : 'bus', 13)}${n}${late ? '<span class="x">+4</span>' : ''}</span>`; up = !up; }
  if (inc) { /* 412 hidden under the pin */ }
  const other = [['204', 1067, 140], ['380', 1259, 500]];
  for (const [n, x, y, late] of other) html += `<span class="mk${n === '380' ? ' res' : ' dim'}${late ? ' delay' : ''}${n === '380' && S.step === 1 && S.res === '380' ? ' sel' : ''}" style="left:${x}px;top:${y}px"${n === '380' ? ' data-pick="380"' : ''}>${ic(late ? 'stopwatch' : n === '380' ? 'repeat' : 'bus', 13)}${n}${late ? '<span class="x">+4</span>' : ''}</span>`;
  // reserve 417 drives towards the crash after the driver accepts
  let r417 = DEP; if (S.step === 3) r417 = [DEP[0] - 26, DEP[1] - 34];
  if (S.step < 4) html += `<span class="mk res${S.step >= 1 && S.res === '417' ? ' sel' : ''}" style="left:${r417[0]}px;top:${r417[1]}px" data-pick="417">${ic('repeat', 13)}417</span>`;
  html += `<span class="mk res" style="left:1295px;top:383px;opacity:.6">${ic('batteryLow', 13)}502</span>`;
  if (S.step < 4) html += `<span class="depot" style="left:${DEP[0] - 148}px;top:${DEP[1] - 4}px"><b>Депо «Северное»</b><div class="t11 mut">2 резерва на выходе</div></span>`;
  if (S.step === 2 || S.step === 3) html += `<span class="eta" style="left:${DEP[0] + 64}px;top:${DEP[1] + 1}px">в пути · ${S.step === 3 ? RESV[S.res].min - 1 : RESV[S.res].min} мин</span>`;

}
function progress(start, end, at, chip, kind) {
  const N = 10; let h = '<i></i><i class="f" style="width:' + (at / (N - 1) * 100) + '%"></i>';
  for (let k = 0; k < N; k++) h += `<b class="${k > at ? 'n' : ''}" style="left:${k / (N - 1) * 100}%"></b>`;
  h += `<em class="${kind}" style="left:${(at + .5) / (N - 1) * 100}%">${chip}</em>`;
  return `<div class="prog"><span>${start}</span><div class="ln">${h}</div><span>${end}</span></div><div class="ends"><span>Вокзал</span><span>Северная</span></div>`;
}
function card() {
  const R = PLATE[S.res];
  if (S.step === 0) return `<div class="chd"><span class="t">Электробус</span><span class="pill">В 405 КО</span><span class="r">64% ${ic('batteryCharging', 16)} 38 ${ic('busFront', 16)}</span></div>
    ${progress('13:58', '14:52', 3, '+4 мин', 'delay')}
    <div class="sug">${ic('repeat', 16)}<span>Предложение: придержать В 412 КО на 2 мин на ближайшей остановке — интервалы станут 4 и 4 мин вместо 6 и 2.</span></div>
    <div class="btns"><button class="btn p" data-act="hold">${ic('check', 16)}Придержать В 412 КО</button><button class="btn s" data-act="toast" data-msg="Звонок водителю В 405 КО…">${ic('phone', 16)}Позвонить водителю</button></div>`;
  const head = `<div class="chd"><span class="t">Электробус</span><span class="pill">В 412 КО</span><span class="r">71% ${ic('batteryCharging', 16)} 34 ${ic('busFront', 16)}</span></div>`;
  if (S.step === 1) {
    const rc = ['417', '380', '502'].map(n => [n, RESV[n]]).map(([n, r]) => `<button class="rc${n === S.res ? ' on' : ''}${r.off ? ' off' : ''}" ${r.off ? 'disabled aria-disabled="true"' : `data-pick="${n}"`}><span class="h">${PLATE[n]}<span class="tag${r.off ? ' no' : ''}">${r.tag}</span></span><span class="t13 mut">${r.from}</span><span class="t15 m">${r.km} км · ${r.min} мин</span></button>`).join('');
    return `${head}<div class="bn crit">${ic('warning', 18)}<span>Поломка у «Пл. Мира» в 14:29</span><span class="r">простой 3 мин</span></div>

      <div class="rsh"><span class="t18">Направить резерв</span><span class="arr"><span style="transform:rotate(180deg)">${ic('chevron', 14)}</span><span>${ic('chevron', 14)}</span></span></div>
      <div class="rcs">${rc}</div><div class="why">${ic('check', 16)}<span>${RESV[S.res].why}</span></div>

  }
  if (S.step < 4) {
    const acc = S.step === 3;
    return `${head}<div class="bn res">${ic('check', 18)}<span>${R} назначен в 14:32</span><span class="r">прибытие ${arrive()}</span></div>
      ${progress('14:04', '14:58', 3, '+3 мин', 'crit')}
      <div class="ride"><div class="h">${R} · едет на замену<span>${RESV[S.res].km} км · ${RESV[S.res].min} мин</span></div><div class="pb"><i style="width:${acc ? 30 : 6}%"></i></div>
        <div class="ends" style="margin:0"><span>Депо «Северное» · 14:32</span><span>«Пл. Мира» · ${arrive()}</span></div>
        <div class="ds"><i class="dot ${acc ? 'ok' : ''}"></i>${acc ? `Водитель ${R} принял · 14:33` : `Водитель ${R}: ждём подтверждения`}</div></div>
      <div class="btns">${acc ? `<button class="btn s" data-act="toast" data-msg="Звонок водителю ${R}…">${ic('phone', 16)}Позвонить водителю ${R}</button>` : `<button class="btn s" data-act="phone">${ic('busFront', 16)}Телефон водителя</button>`}<button class="btn g" data-act="cancel">${ic('x', 14)}Отменить назначение</button></div>`;
  }
  return `<span class="t18">Повтор аварии на карте</span><span class="t14 mut">14:29–14:52: где стояли борта, как рос разрыв, когда пришла замена.</span>
    <div class="tl"><i class="tk"></i><i style="left:0;background:var(--crit)"></i><i style="left:13%;background:var(--res)"></i><i style="left:39%;background:var(--muted)"></i><i style="left:100%;background:var(--muted)"></i></div>
    <div class="ends" style="margin:0"><span>14:29 поломка</span><span>14:52 норма</span></div>
    <div class="btns"><a class="btn p" href="map.html">${ic('check', 16)}Смотреть повтор в 3D</a><button class="btn s" data-act="toast" data-msg="Разбор добавлен в отчёт смены">В отчёт смены</button></div>`;
}
function phone() {
  const R = PLATE[S.res];
  return `<div class="veil" data-act="phoneClose"><div class="phone" role="dialog" aria-label="Телефон водителя ${R}" data-stop="1">
    <div class="sb"><span>14:32</span><span class="t12">5G</span></div>
    <div class="ct"><div class="t14 mut" style="display:flex;gap:8px;align-items:center">${ic('busFront', 20)}${R} · смена до 22:00</div>
      <div class="na"><span class="k">НОВОЕ НАЗНАЧЕНИЕ</span><span class="t">Замена на маршруте №10</span><span class="d">Вместо В 412 КО — поломка у «Пл.&nbsp;Мира». Пассажиры ждут на остановке.</span></div>
      <div class="mini"><svg width="342" height="190" viewBox="0 0 342 190" aria-hidden="true"><path d="M0 118 L342 64" stroke="var(--s4)" stroke-width="10"/><path d="M128 0 L188 190" stroke="var(--s4)" stroke-width="10"/><path d="M250 0 L290 190" stroke="var(--s4)" stroke-width="6"/>
        <path d="M40 150 C110 150 120 82 200 76 C250 72 272 52 296 40" stroke="var(--route)" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="40" cy="150" r="7" fill="var(--fg)"/><circle cx="296" cy="40" r="8" fill="var(--crit)" stroke="var(--s1)" stroke-width="3"/>
        <text x="20" y="176" font-size="12" font-weight="500" fill="var(--fg)">Депо «Северное»</text><text x="226" y="62" font-size="12" font-weight="500" fill="var(--fg)">Пл. Мира</text></svg>
        <span class="eta" style="left:120px;top:100px;background:var(--acc);color:var(--on-acc);border-color:transparent">${RESV[S.res].km} км · ${RESV[S.res].min} мин</span></div>
      <div><div class="kv"><span class="mut">Прибыть к</span><span>${arrive()}</span></div><div class="kv"><span class="mut">Дальше</span><span>круг по №10 до 15:32</span></div><div class="kv"><span class="mut">${S.res === '380' ? 'Топливо' : 'Заряд'}</span><span>${S.res === '380' ? 'дизель · полный бак' : '82% · хватит на 3 круга'}</span></div></div>
      <span style="flex:1"></span>

      <div class="t13 mut" style="text-align:center">Нет ответа 1 мин — диспетчер позвонит сам</div></div><div class="hb"><i></i></div></div></div>`;
}
const DEMO = [
  ['1/5 · смена идёт, 14:28', 'Дальше: авария'], ['2/5 · выберите резерв', ''], ['3/5 · ждём водителя', 'Телефон водителя'],
  ['4/5 · замена в пути', 'К разбору 15:05'], ['5/5 · разбор аварии', 'Сначала'],
];
function render() {
  const [st, nx] = DEMO[S.step];
  stage.innerHTML = `<div class="map" role="img" aria-label="Карта района: маршрут №10"></div>${overlay()}${rail()}${routes()}${trips()}
    <nav class="mode" aria-label="Режим"><a class="on" href="./" aria-current="page">Смена</a><a href="map.html?mode=2d">Карта района</a><a href="map.html">3D</a></nav>
    <div class="demo" aria-live="polite"><span class="st">Сценарий ${st}</span>${nx ? `<button data-act="next">${nx} →</button>` : ''}</div>
    <div class="zoom"><div>+</div><div>−</div></div><div class="lay">${ic('layers', 20)}</div><span class="attr">© OpenStreetMap</span>

let tt; function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }
function go(step) { S.step = step; if (step === 1) S.t0 = Date.now(); if (step === 4) S.tab = 'log'; if (step === 0) { S.tab = 'trips'; S.res = '417'; } render(); }

stage.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) return;
  const tab = e.target.closest('[data-tab]'); if (tab) { S.tab = tab.dataset.tab; render(); return; }
  const pick = e.target.closest('[data-pick]'); if (pick && S.step === 1) { S.res = pick.dataset.pick; render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'theme') { const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim().toLowerCase() === '#121417'; const n = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try { localStorage.setItem('dispatch-theme', n); } catch (err) {} }
  else if (act === 'next') { if (S.step === 0) go(1); else if (S.step === 2) { S.phone = true; render(); } else if (S.step === 3) go(4); else if (S.step === 4) go(0); }
  else if (act === 'hold') toast('Команда ушла водителю В 412 КО: стоянка 2 мин на ближайшей остановке');
  else if (act === 'toast') toast(a.dataset.msg);
  else if (act === 'assign') { go(2); toast(`Задание ушло водителю ${PLATE[S.res]}`); }
  else if (act === 'cancel') go(1);
  else if (act === 'phone') { S.phone = true; render(); }
  else if (act === 'phoneClose') { S.phone = false; render(); }
  else if (act === 'accept') { S.phone = false; go(3); toast(`Водитель ${PLATE[S.res]} принял задание`); }
  else if (act === 'decline') { S.phone = false; const other = S.res === '417' ? '380' : '417'; S.res = other; go(1); toast(`Водитель отказался. Рекомендация пересчитана: ${PLATE[other]}`); }
});
addEventListener('keydown', e => { if (e.key === 'Escape' && S.phone) { S.phone = false; render(); } });
setInterval(() => { const t = document.getElementById('tmr'); if (t) t.textContent = timer(); }, 1000);

// fit the 1440×900 screen to the window; on a phone keep a readable scale and pan sideways
const root = document.getElementById('root'), sizer = document.getElementById('sizer');
function fit() {
  const s = Math.min(innerWidth / 1440, innerHeight / 900), narrow = s < .6;
  root.classList.toggle('narrow', narrow);
  if (narrow) { const k = Math.min(1, innerHeight / 900); stage.style.transform = `scale(${k})`; sizer.style.width = 1440 * k + 'px'; sizer.style.height = 900 * k + 'px'; }
  else { stage.style.transform = `translate(${(innerWidth - 1440 * s) / 2}px, ${(innerHeight - 900 * s) / 2}px) scale(${s})`; sizer.style.width = sizer.style.height = '1px'; }
}
try { const t = localStorage.getItem('dispatch-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
addEventListener('resize', fit); fit();
const q = new URLSearchParams(location.search).get('step'); go(q ? Math.max(0, Math.min(4, +q)) : 0);
if (!q && !matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(() => { if (S.step === 0) go(1); }, 6000);
document.fonts && document.fonts.ready.then(render);
})();
